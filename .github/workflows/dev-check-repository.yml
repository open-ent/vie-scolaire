name: dev-check-repository

# Contrôle de build à chaque push, en UN SEUL job (comme build.sh local : gulp puis maven dans
# le même workspace, sans handoff d'artefact — évite « frontend-assets not found » quand la sortie
# gulp n'atterrit pas dans src/main/resources/). Remplace le legacy Gradle. CCTP 51C — CI.
on: [push]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build (Gulp + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IHM Angular (legacy) : gulp 3.9 tourne sous Node 10 (deps anciennes). tsconfig racine exclut
      # frontend/ -> ts-loader ne compile plus les .tsx React (sinon TS2307 Cannot find module 'react').
      - name: Build frontend Angular (Gulp via Node 10 en Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"

      # IHM React (migration) : projet Vite autonome (Node 20). Bundle copie dans les resources du
      # module (vsco_react.html -> /viescolaire/public/index.js|css). Les 2 IHM coexistent (?ui=).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build frontend React (Vite)
        run: |
          cd frontend
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
          mkdir -p ../src/main/resources/public
          cp -r dist/public/. ../src/main/resources/public/

      - name: Verifier les deux bundles (Angular + React)
        run: |
          test -f src/main/resources/public/dist/vsco_personnels.js       || { echo "::error::bundle Angular manquant"; exit 1; }
          test -f src/main/resources/public/index.js                      || { echo "::error::bundle React manquant"; exit 1; }
          test -f src/main/resources/view/viescolaire/vsco_personnel.html || { echo "::error::vue Angular manquante"; exit 1; }
          test -f src/main/resources/view/viescolaire/vsco_react.html     || { echo "::error::vue React manquante"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build fat JAR (Maven)
        run: mvn clean package -Dmaven.test.skip=true -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}
