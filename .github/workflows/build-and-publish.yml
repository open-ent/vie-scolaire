name: Build & Publish Fat Mod

on:
  push:
    branches: ['*-patched', '*-patched-dev', main, master, develop, dev]
    tags: ['*']
  pull_request:
    branches: [main, master, develop, dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Fat Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # Build le frontend AVANT le package Maven : produit le shell view/
      # (gulp updateRefs copie view-src/*.html -> view/viescolaire/*.html, dont
      # vsco_personnel.html rendu par DisplayController) + les bundles JS
      # (public/dist, public/js/behaviours.js) et le CSS (public/css).
      # Sans cette etape le fat-jar a "view/: 0" et GET /viescolaire renvoie 500.
      # IHM Angular (gulp) : bundle public/dist/vsco_personnels.js + shell view/. tsconfig racine
      # exclut frontend/ -> ts-loader ne compile plus les .tsx React (sinon TS2307).
      - name: Build frontend Angular (gulp + sass)
        run: |
          pnpm install --frozen-lockfile || pnpm install
          node node_modules/gulp/bin/gulp.js build
          pnpm run build:sass
      # IHM React (vsco_react.html -> /viescolaire/public/index.js) : sous-projet Vite frontend/,
      # paquets prives @open-ent -> auth via OPENENT_PACKAGES_TOKEN (frontend/.npmrc). Copie
      # dist/public -> resources/public. Fat-mod complet (Angular + React), commutation ?ui=. [B]
      - name: Build frontend React (sous-projet Vite frontend/)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm build
          mkdir -p ../src/main/resources/public
          cp -r dist/public/. ../src/main/resources/public/
      - name: Verifier les deux bundles (Angular + React)
        run: |
          test -f src/main/resources/public/dist/vsco_personnels.js       || { echo "::error::bundle Angular manquant"; exit 1; }
          test -f src/main/resources/public/index.js                      || { echo "::error::bundle React manquant"; exit 1; }
          test -f src/main/resources/view/viescolaire/vsco_personnel.html || { echo "::error::vue Angular manquante"; exit 1; }
          test -f src/main/resources/view/viescolaire/vsco_react.html     || { echo "::error::vue React manquante"; exit 1; }
      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build fat JAR
        run: mvn clean package -DskipTests -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn test -B

      - name: Publish fat JAR to GitHub Packages
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          FAT_ABS=$(realpath "${FAT_JAR}")
          BASE=$(basename "${FAT_JAR}" -fat.jar)
          GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
          echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> GitHub Packages"
          ( cd /tmp && mvn deploy:deploy-file -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=github -Durl="https://maven.pkg.github.com/${{ github.repository }}" -B ) || true

      # NB : PAS de publication rct-nexus ici. vie-scolaire est un module DUAL Angular/React ;
      # son fat-mod destiné à la prod (avec le bundle React) est construit et publié sur nexus
      # par scripts/patch-openent-react-module.sh (build Vite + copie dans resources/public).
      # Publier ici republierait, aux mêmes coordonnées, un jar SANS React -> ecraserait le bon
      # artefact (regression ?ui=react en prod). La CI reste un build-check (+ GitHub Packages sur tag).

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*-fat.jar
          generate_release_notes: true
